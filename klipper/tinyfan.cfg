#####################################################################
# TinyFan2350 v3.0 - Klipper config
#
# Board:  Waveshare RP2350-Zero on TinyFan2350 v3.0
#         5x 4-pin PWM fans (JST-XH) | 2x WS2812 5V ports (JST-XH)
#         4x thermistor ports (JST-XH 2-pin) | EXP header (GP15/GP14 + spares)
# Power:  J1 = VIN 12-24V (fans), J2 = 5V (logic, LEDs, 5V fans)
#
# Include from printer.cfg with:   [include tinyfan.cfg]
# Then replace the serial id below with your own:
#   ls /dev/serial/by-id/
#
# Firmware build (make menuconfig):
#   Micro-controller Architecture : Raspberry Pi RP2040/RP235x
#   Processor model               : rp2350
#   Bootloader offset             : No bootloader
#   Communication interface       : USBSERIAL
# Flash: hold BOOT, plug in USB, then
#   make flash FLASH_DEVICE=2e8a:000f
# (Copying klipper.uf2 to the RPI-RP2 / RP2350 drive does not work
#  for rp2350 - use make flash or picotool.)
#
# Full guide: docs/klipper.md
#####################################################################

[mcu tinyfan]
serial: /dev/serial/by-id/usb-Klipper_rp2350_XXXXXXXXXXXXXXXX-if00
restart_method: command

[board_pins tinyfan]
mcu: tinyfan
aliases:
    # --- Fan ports FAN1..FAN5 (JST-XH 4-pin: 1 GND, 2 +V, 3 TACH, 4 PWM)
    # PWM: 3V3 -> 5V open-drain shifter (2N7002, 10k pull-up to 3V3, 2.2k to 5V).
    # TACH: on-board 10k pull-up to 3V3, 10k series + BAT54S clamp.
    # Every PWM pin is on its own hardware PWM slice (0-5).
    FAN1_PWM=gpio0,  FAN1_TACH=gpio1,
    FAN2_PWM=gpio2,  FAN2_TACH=gpio3,
    FAN3_PWM=gpio4,  FAN3_TACH=gpio5,
    FAN4_PWM=gpio6,  FAN4_TACH=gpio7,
    FAN5_PWM=gpio8,  FAN5_TACH=gpio9,
    # --- WS2812 ports (JST-XH 3-pin: 1 GND, 2 +5V, 3 DATA)
    # 74HCT2G17 3V3 -> 5V buffer + 1k series resistor + clamp, 10k pull-down on input.
    LED1=gpio12, LED2=gpio13,
    # --- Thermistor ports TH1..TH4 (JST-XH 2-pin: 1 SIGNAL, 2 GND)
    # 4.7k 1% pull-up to 3V3 + 100nF filter, 10k series to the pin (protection).
    TH1=gpio26, TH2=gpio27, TH3=gpio28, TH4=gpio29,
    # --- EXP header (J5: 1 GND, 2 3V3, 3 GP15, 4 GP14, 5 GP11, 6 GP10) - 3.3V only!
    # gpio10 and gpio11 are spare pins on EXP J5 pins 6/5.
    EXP_GP15=gpio15, EXP_GP14=gpio14, EXP_GP11=gpio11, EXP_GP10=gpio10,
    # --- RGB LED on the RP2350-Zero module itself
    STATUS_LED=gpio16

[temperature_sensor tinyfan_mcu]
sensor_type: temperature_mcu
sensor_mcu: tinyfan
min_temp: 0
max_temp: 100

[neopixel tinyfan_status]
pin: tinyfan:STATUS_LED
chain_count: 1
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.15
initial_BLUE: 0.0


#####################################################################
# FANS
# Set each port's jumper BEFORE powering up:
#   JP top two pins    = VIN (whatever you feed J1: 12V or 24V)
#   JP bottom two pins = 5V
# The fan's rated voltage must match. A 12V fan on a 24V VIN will burn.
#
# 25 kHz PWM per the Intel 4-wire fan spec. Many 4-pin fans keep
# turning at their minimum speed at 0% PWM - that is normal.
# tachometer_ppr: 2 is standard for PC fans.
#
# MODE jumper (JM1-JM5), also set BEFORE powering up:
#   JM bottom two pins (4P) = 4-pin PWM fan (use the blocks below as they are)
#   JM top two pins (2/3)  = 2-pin or 3-pin fan. The board then switches the
#                        fan's ground with a MOSFET. In that block:
#                          cycle_time: 0.010      (100 Hz, NOT 25 kHz)
#                          off_below: 0.20        (most 2-pin fans stall lower)
#                        and delete tachometer_pin/_ppr (the tach reading
#                        is garbage while the ground is being switched).
#   Since v3.0 the MOSFET gate is driven hard (1k, 2.2k pull-up), so even a
#   forgotten 25 kHz only costs about 0.06 W at 0.6 A. 100 Hz is still
#   recommended: most 2/3-pin fans run smoother and quieter on slow PWM.
# Example for a 2-pin 24V 5015 blower on FAN5 with JM5 on the top two pins (2/3):
#   [fan_generic fan5]
#   pin: tinyfan:FAN5_PWM
#   hardware_pwm: True
#   cycle_time: 0.010
#   off_below: 0.20
#####################################################################

[fan_generic fan1]
pin: tinyfan:FAN1_PWM
tachometer_pin: tinyfan:FAN1_TACH
tachometer_ppr: 2
hardware_pwm: True
cycle_time: 0.00004
off_below: 0.10

[fan_generic fan2]
pin: tinyfan:FAN2_PWM
tachometer_pin: tinyfan:FAN2_TACH
tachometer_ppr: 2
hardware_pwm: True
cycle_time: 0.00004
off_below: 0.10

[fan_generic fan3]
pin: tinyfan:FAN3_PWM
tachometer_pin: tinyfan:FAN3_TACH
tachometer_ppr: 2
hardware_pwm: True
cycle_time: 0.00004
off_below: 0.10

[fan_generic fan4]
pin: tinyfan:FAN4_PWM
tachometer_pin: tinyfan:FAN4_TACH
tachometer_ppr: 2
hardware_pwm: True
cycle_time: 0.00004
off_below: 0.10

[fan_generic fan5]
pin: tinyfan:FAN5_PWM
tachometer_pin: tinyfan:FAN5_TACH
tachometer_ppr: 2
hardware_pwm: True
cycle_time: 0.00004
off_below: 0.10


#####################################################################
# THERMISTORS (TH1..TH4)
# Default: 100k NTC, beta 3950 (the usual "chamber"/"Generic 3950"
# thermistor). Change sensor_type to match yours, e.g.
# "ATC Semitec 104GT-2" or "NTC 100K MGB18-104F39050L32".
# Delete any block you don't have a thermistor plugged into,
# otherwise Klipper will shut down with "ADC out of range".
#####################################################################

[temperature_sensor th1]
sensor_type: Generic 3950
sensor_pin: tinyfan:TH1
pullup_resistor: 4700
min_temp: -10
max_temp: 120

#[temperature_sensor th2]
#sensor_type: Generic 3950
#sensor_pin: tinyfan:TH2
#pullup_resistor: 4700
#min_temp: -10
#max_temp: 120

#[temperature_sensor th3]
#sensor_type: Generic 3950
