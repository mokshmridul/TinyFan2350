#[temperature_sensor th4]
#sensor_type: Generic 3950
#sensor_pin: tinyfan:TH4
#pullup_resistor: 4700
#min_temp: -10
#max_temp: 120


#####################################################################
# LED PORTS (5V WS2812 / SK6812)
# LED power: JL1/JL2 pick the strip voltage. Top two pins = VIN
# (12/24V strips such as WS2815), bottom two pins = 5V (WS2812/SK6812).
# Data is always 5V. Each LED port is good for about 2A.
# A 5V strip on the VIN position will be destroyed - check JL first.
# For RGBW strips use color_order: GRBW.
#####################################################################

[neopixel led1]
pin: tinyfan:LED1
chain_count: 10
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[neopixel led2]
pin: tinyfan:LED2
chain_count: 10
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0


