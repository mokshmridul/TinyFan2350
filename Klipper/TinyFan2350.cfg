#####################################################################
#  TinyFan2350 - Klipper base config (board v1.3)
#  MCU: Waveshare RP2350-Zero (RP2350A), flashed with Klipper (USB)
#  The module is powered by its USB cable; VIN and 5V feed the fans and LEDs.
#
#  Copy this file next to printer.cfg and add:   [include TinyFan2350.cfg]
#  Then uncomment / adapt the examples at the bottom.
#####################################################################

[mcu tinyfan]
# Replace with the name that  ls /dev/serial/by-id/*  shows for this board
serial: /dev/serial/by-id/usb-Klipper_rp2350_XXXX-if00
restart_method: command

[temperature_sensor TinyFan2350]
sensor_type: temperature_mcu
sensor_mcu: tinyfan
min_temp: 0
max_temp: 100

[board_pins tinyfan]
mcu: tinyfan
aliases:
    # FAN ports (JST-XH 4-pin: 1 GND, 2 +V, 3 TACH, 4 PWM)
    # Every fan has its own hardware PWM slice -> fully independent speed & cycle_time.
    FAN1_PWM=gpio0, FAN1_RPM=gpio1,
    FAN2_PWM=gpio2, FAN2_RPM=gpio3,
    FAN3_PWM=gpio4, FAN3_RPM=gpio5,
    FAN4_PWM=gpio6, FAN4_RPM=gpio7,
    FAN5_PWM=gpio8, FAN5_RPM=gpio9,

    # LED ports (JST-XH 3-pin: 1 GND, 2 +V, 3 DATA) - data level-shifted to 5V (2N7002)
    LED1=gpio10, LED2=gpio11,

    # Thermistor ports (JST-XH 2-pin), 4.7k pull-up to 3V3
    TH1=gpio26, TH2=gpio27, TH3=gpio28, TH4=gpio29,

    # EXP header (1 GND, 2 3V3, 3..6 = GP12..GP15) - 3.3V logic only!
    EXP1=gpio12, EXP2=gpio13, EXP3=gpio14, EXP4=gpio15,

    # Waveshare on-board WS2812
    ONBOARD_LED=gpio16

[neopixel tinyfan_onboard]
pin: tinyfan:ONBOARD_LED
chain_count: 1
color_order: GRB
initial_RED: 0
initial_GREEN: 0.2
initial_BLUE: 0



#####################################################################
###                       EXAMPLE CONFIGS                         ###
#####################################################################
#
# The examples are alternatives and several of them use the same port.
# Uncomment only what you need and use every pin in one section only.
#
# FAN MODE (jumper "mode", the left jumper under each fan):
#   4P  = 4-pin PWM fan. Fan GND is solid, the MOSFET pulls the PWM wire.
#         -> pin is INVERTED (!), use 25 kHz:  cycle_time: 0.00004
#         -> if the MCU is unpowered/resetting the fan runs at FULL speed.
#         -> a 2- or 3-pin fan on 4P runs at full speed whenever its supply
#            is on. It needs no section here (see the cooling fan below).
#   2/3 = 2- or 3-pin fan. The MOSFET switches the fan's GND (low side).
#         -> pin is NOT inverted, use a low frequency, e.g. cycle_time: 0.01
#         -> if the MCU is unpowered/resetting the fan is OFF.
#
# FAN VOLTAGE (jumper "volt", the right jumper): VIN (12/24V) or 5V.
#
# TACHO: always use the pull-up "^" on the RPM pin (the board has no
#        pull-up of its own).
#        In 2/3 mode RPM is only valid at 100% speed (the GND is chopped).



