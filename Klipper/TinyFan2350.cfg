### Addressable LED strips (WS2812 / SK6812 / WS2811)
# Set the LED voltage jumper to match the strip (5V strip -> 5V, 12/24V WS2811 -> VIN)!
# The 5V input must be powered for the data signal, also with a strip on VIN.
# chain_count = number of LEDs on the port.
