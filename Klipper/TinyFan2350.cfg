### Cooling fan for the TinyFan2350 itself (40 mm fan on the fan bridge)
# Simplest and safest: set that port's mode jumper to 4P. A 2- or 3-pin fan
# then runs whenever its supply is on, and no section is needed here.
#
# Switched instead (2-pin fan, mode jumper = 2/3): runs when the RP2350 is
# warmer than target_temp (on above +2, off below -2). The RP2350's temperature
# says little about the fuses and connectors, and the fan stops when the MCU
# resets or Klipper is not running.
# The MCU temperature can only be read by one section: delete
# [temperature_sensor TinyFan2350] at the top of this file when you use this.
#[temperature_fan tinyfan_cooling]
#pin: tinyfan:FAN5_PWM
#sensor_type: temperature_mcu
#sensor_mcu: tinyfan
#min_temp: 0
#max_temp: 100
#target_temp: 45
#control: watermark



